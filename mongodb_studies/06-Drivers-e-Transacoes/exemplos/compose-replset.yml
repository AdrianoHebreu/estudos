# Replica set de 1 nó para o módulo 06 (transações e change streams exigem replica set).
# Arranque:  docker compose -f compose-replset.yml up -d
# Estado:    docker compose -f compose-replset.yml ps   (espera por "healthy")
# Limpeza:   docker compose -f compose-replset.yml down -v
name: est-mg06

services:
  mongo:
    image: mongo:8
    container_name: est-mg06-mongo
    # O mongod escuta na mesma porta que expomos (31060). Assim o endereço que o
    # replica set anuncia aos clientes (localhost:31060) é o mesmo que o anfitrião vê.
    command: ["mongod", "--replSet", "rs0", "--port", "31060", "--bind_ip_all"]
    ports:
      - "31060:31060"
    volumes:
      - dados:/data/db
    healthcheck:
      # Se o replica set ainda não existe, inicia-o (e falha esta verificação); só passa a healthy quando o nó for primário.
      test:
        - CMD
        - mongosh
        - --port
        - "31060"
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:31060'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  dados:
